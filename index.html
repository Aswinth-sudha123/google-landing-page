<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;

}



body {
    background: #202124;
    color: white;
}


header {
    display: flex;
    justify-content: space-between;
    padding: 18px 25px;
    font-size: 14px;
}

header a {
    color: white;
    text-decoration: none;
    margin-right: 18px;
}

header a:hover {
    text-decoration: underline;
}

.right-links {
    display: flex;
    align-items: center;
}

.apps {
    font-size: 20px;
    margin-right: 15px;
    cursor: pointer;
}

.profile {
    width: 35px;
    height: 35px;
    background: #4285f4;
    border-radius: 50%;
}


main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-top: 120px;
}


.logo {
    font-size: 80px;
    font-weight: normal;
    margin-bottom: 30px;
}

.blue {
    color: #4285F4;
}

.red {
    color: #EA4335;
}

.yellow {
    color: #FBBC05;
}

.green {
    color: #34A853;
}


.search-box {
    width: 720px;
    max-width: 90%;
    display: flex;
    align-items: center;
    background: #303134;
    border: 1px solid #5f6368;
    border-radius: 30px;
    padding: 12px 20px;
}

.search-box:hover {
    background: #484a4c;
}

.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    margin: 0 10px;
}

.search-box span {
    font-size: 20px;
    padding: 8px;
}


.buttons {
    margin-top: 30px;
}

.buttons button {
    background: #303134;
    color: white;
    border: 1px solid #303134;
    padding: 10px 20px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.buttons button:hover {
    border:0.5px solid #5f6368;
}


.languages {
    margin-top: 30px;
    font-size: 14px;
    color: #bdc1c6;
}

.languages a {
    color: #8ab4f8;
    margin: 0 5px;
    text-decoration: none;
}

.languages a:hover {
    text-decoration: underline;
}



.ai-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #3c4043;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: .3s;
}

/* Footer */

footer{
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #171717;
    color: #e2e3e5;
    font-size: 14px;
}


.footer-left{
    padding: 15px 30px;
    border-bottom: 1px solid #3c4043;
}


.footer-right{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    flex-wrap: wrap;
}


.footer-right a{
    color: #ffffff;
    text-decoration: none;
    margin-right: 20px;
}

.footer-right a:hover{
    text-decoration: underline;
}


.divider{
    flex: 1;
}


</style>

<body>


    <header>
        <div class="left-links">
            <a href="#">About</a>
            <a href="#">Store</a>
        </div>

        <div class="right-links">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <span class="apps">☰</span>
            <div class="profile"></div>
        </div>
    </header>

    <main>
        <h1 class="logo">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </h1>

        <div class="search-box">
            <span><i class="fa-solid fa-magnifying-glass" style="color: rgb(238, 240, 244);"></i></span>
            <input type="text" placeholder="Search Google or type a URL">
            <span><i class="fa-solid fa-microphone"></i></span>
            <span><i class="fa-solid fa-camera"></i></span>

            <button class="ai-btn">
               <svg focusable="false" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24" height="24" viewBox="0 0 24 24" width="24"><g><rect fill="none" height="24" width="24"></rect></g><g><g><path d="M17.5 12c0-3.04 2.46-5.5 5.5-5.5-3.04 0-5.5-2.46-5.5-5.5 0 3.04-2.46 5.5-5.5 5.5 3.04 0 5.5 2.46 5.5 5.5z"></path><path d="M15.65 11.58c.18-.5.27-1.03.31-1.58h-2c-.1 1.03-.51 1.93-1.27 2.69-.88.87-1.94 1.31-3.19 1.31C7.03 14 5 12.07 5 9.5 5 7.03 6.93 5 9.5 5c.46 0 .89.08 1.3.2l1.56-1.56C11.5 3.22 10.55 3 9.5 3 5.85 3 3 5.85 3 9.5S5.85 16 9.5 16c.56 0 2.26-.06 3.8-1.3l6.3 6.3 1.4-1.4-6.3-6.3c.4-.5.72-1.08.95-1.72z"></path></g></g></svg>
                AI Mode
            </button>
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>

        <p class="languages">
            Google offered in:
            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">தமிழ்</a>
            <a href="#">ગુજરાતી</a>
        </p>
    </main>

    <footer>
        <div class="footer-left">
            <p>India</p>
        </div>
        
        <div class="footer-right">
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How Search works</a>
            <span class="divider"></span>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
        </div>
    </footer>

</body>

</html>
